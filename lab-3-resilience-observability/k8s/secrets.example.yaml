# NO real values. Create the real Secrets by hand with oc create secret; never commit them.
# Example only: NO real values. Never commit the real Secrets.
# In the lab these Secrets are created by the postgresql-persistent template (Step 2 of the guide).
# If you recreate them by hand, generate passwords with: openssl rand -hex 16
apiVersion: v1
kind: Secret
metadata: { name: catalog-db }
stringData:
  database-name: catalog
  database-user: catalog
  database-password: <generate-a-password>
---
apiVersion: v1
kind: Secret
metadata: { name: order-db }
stringData:
  database-name: orders
  database-user: orders
  database-password: <generate-a-password>
---
apiVersion: v1
kind: Secret
metadata: { name: notification-db }
stringData:
  database-name: notifications
  database-user: notifications
  database-password: <generate-a-password>
---
# Lab 3: the fake key of the email provider. Create it with:
#   oc create secret generic notification-email --from-literal=EMAIL_API_KEY="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata: { name: notification-email }
stringData:
  EMAIL_API_KEY: <generate-with-openssl-rand-hex-16>
