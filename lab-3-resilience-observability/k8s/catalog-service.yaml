# catalog-service: ImageStream, BuildConfig (S2I from this repository), Deployment, Service.
# Reference manifests, equivalent to what `oc new-app` + the `oc set ...` commands of the guide produce.
# Replace <your-github-user> before applying. The catalog-db Secret is created by the
# postgresql-persistent template and is NOT stored in Git.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: catalog-service
  labels: { app: catalog-service, app.kubernetes.io/part-of: eshop }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: catalog-service
  labels: { app: catalog-service, app.kubernetes.io/part-of: eshop }
spec:
  source:
    type: Git
    git: { uri: https://github.com/<your-github-user>/eshop-cloud-native-labs, ref: main }
    contextDir: lab-3-resilience-observability/catalog-service
  strategy:
    type: Source
    sourceStrategy:
      from: { kind: ImageStreamTag, namespace: openshift, name: "nodejs:22-ubi9" }
  output:
    to: { kind: ImageStreamTag, name: "catalog-service:latest" }
  triggers:
    - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels: { app: catalog-service, app.kubernetes.io/part-of: eshop }
  annotations:
    # Rolls out a new Pod every time the build pushes a new catalog-service:latest
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"catalog-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"catalog-service\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels: { deployment: catalog-service }
  template:
    metadata:
      labels: { deployment: catalog-service, app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: catalog-service:latest
          ports: [{ containerPort: 8080, protocol: TCP }]
          envFrom:
            - configMapRef: { name: catalog-config }   # Lab 3: configuration lives in the ConfigMap
          env:
            - { name: DB_DATABASE_NAME, valueFrom: { secretKeyRef: { name: catalog-db, key: database-name } } }
            - { name: DB_DATABASE_USER, valueFrom: { secretKeyRef: { name: catalog-db, key: database-user } } }
            - { name: DB_DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: catalog-db, key: database-password } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }   # the HPA measures CPU as a % of this
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:                      # the database: may take the Pod out of the load balancer
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:                       # the process only: never a dependency
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels: { app: catalog-service, app.kubernetes.io/part-of: eshop }
spec:
  selector: { deployment: catalog-service }
  ports:
    - { name: 8080-tcp, port: 8080, targetPort: 8080 }
