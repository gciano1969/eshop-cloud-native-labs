# Example only: NO real values. Never commit the real Secrets.
# In the lab these Secrets are created by the postgresql-persistent template (Step 2 of the guide).
# If you recreate them by hand, generate passwords with: openssl rand -hex 16
apiVersion: v1
kind: Secret
metadata: { name: catalog-db }
stringData:
  database-name: catalog
  database-user: catalog
  database-password: <generate-a-password>
---
apiVersion: v1
kind: Secret
metadata: { name: order-db }
stringData:
  database-name: orders
  database-user: orders
  database-password: <generate-a-password>
