# Single-node Apache Kafka (KRaft: broker + controller in one process) for the Developer Sandbox.
# No operator, no authentication: reachable only inside the namespace. Production would use a
# dedicated, replicated cluster (e.g. Streams for Apache Kafka) with TLS/SASL or mTLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels: { app.kubernetes.io/part-of: eshop }
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.bootstrap.servers=localhost:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://localhost:9093
    advertised.listeners=PLAINTEXT://kafka:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data/logs
    num.partitions=3
    auto.create.topics.enable=false
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    share.coordinator.state.topic.replication.factor=1
    share.coordinator.state.topic.min.isr=1
    log.retention.hours=168
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels: { app.kubernetes.io/part-of: eshop }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: { app: kafka, app.kubernetes.io/part-of: eshop }
spec:
  replicas: 1
  strategy: { type: Recreate }          # RWO volume: never two Pods at the same time
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
      - name: kafka
        image: docker.io/apache/kafka:4.3.1
        # The image's own start script writes to /opt/kafka/config, which the arbitrary
        # OpenShift UID cannot write: start the server with our own command instead.
        command: [ "/bin/bash", "-c" ]
        args:
        - |
          set -e
          if [ ! -f /var/lib/kafka/data/logs/meta.properties ]; then
            /opt/kafka/bin/kafka-storage.sh format --standalone \
              --cluster-id "$CLUSTER_ID" --config /config/server.properties
          fi
          exec /opt/kafka/bin/kafka-server-start.sh /config/server.properties
        env:
        - { name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw" }   # fixed: must match the data on the volume
        - { name: LOG_DIR, value: /tmp/kafka-logs }               # /opt/kafka/logs is not writable
        - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
        ports:
        - { name: kafka, containerPort: 9092 }
        resources:
          requests: { cpu: 200m, memory: 768Mi }
          limits:   { cpu: "1", memory: 1Gi }
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 90
          periodSeconds: 30
        volumeMounts:
        - { name: data, mountPath: /var/lib/kafka/data }
        - { name: config, mountPath: /config }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: kafka-data }
      - name: config
        configMap: { name: kafka-config }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/part-of: eshop }
spec:
  selector: { app: kafka }
  ports:
  - { name: kafka, port: 9092 }
